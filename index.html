<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Colty Desktop v3</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/window.css">
  <link rel="stylesheet" href="css/taskbar.css">
</head>
<body>
  <div id="desktop" class="desktop">
    <!-- icons -->
    <div class="icon" data-window="info" style="left:20px;top:20px">
      <img src="assets/icons/about.svg" alt="Info"><span>Info</span>
    </div>
    <div class="icon" data-window="email" style="left:20px;top:90px">
      <img src="assets/icons/email.svg" alt="Email"><span>Email</span>
    </div>
    <div class="icon" data-window="github" style="left:20px;top:160px">
      <img src="assets/icons/github.svg" alt="GitHub"><span>GitHub</span>
    </div>
    <div class="icon" data-window="linkedin" style="left:20px;top:230px">
      <img src="assets/icons/linkedin.svg" alt="LinkedIn"><span>LinkedIn</span>
    </div>
    <div class="icon" data-window="instagram" style="left:20px;top:300px">
      <img src="assets/icons/instagram.svg" alt="Instagram"><span>Instagram</span>
    </div>
    <div class="icon" data-window="notes" style="left:20px;top:370px">
      <img src="assets/icons/notes.svg" alt="Notes"><span>Notes</span>
    </div>
    <div class="icon" data-window="tools" style="left:20px;top:440px">
      <img src="assets/icons/tools.svg" alt="Tools"><span>Tools</span>
    </div>
    <div class="icon" data-window="planner" style="left:20px;top:510px">
      <img src="assets/icons/planner.svg" alt="Planner"><span>Planner</span>
    </div>
  </div>

  <div id="taskbar" class="taskbar">
    <div class="start-button"><img src="assets/icons/start.svg" alt="Start"> Start</div>
    <div class="taskbar-items" id="taskbar-items"></div>
  </div>

  <script src="js/desktop.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
